name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore fixed signing keystore
        env:
          APPBUILDER_KEYSTORE_B64: ${{ secrets.APPBUILDER_KEYSTORE_B64 }}
        run: echo "$APPBUILDER_KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/appbuilder.keystore"

      - name: Build debug APK
        env:
          APPBUILDER_KEYSTORE_FILE: ${{ runner.temp }}/appbuilder.keystore
          APPBUILDER_KEYSTORE_PASSWORD: ${{ secrets.APPBUILDER_KEYSTORE_PASSWORD }}
          APPBUILDER_KEY_ALIAS: ${{ secrets.APPBUILDER_KEY_ALIAS }}
          APPBUILDER_KEY_PASSWORD: ${{ secrets.APPBUILDER_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: appbuilder-lite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
